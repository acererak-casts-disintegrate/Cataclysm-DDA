name: "Release"
# Builds Windows, Linux and macOS (tiles and terminal-only) packages of this fork and publishes them as a GitHub release.
# Push a tag named 0.I-custom-* to release the tagged commit. Running the workflow by hand
# also works once this file is on the repository's default branch; it tags the commit
# it runs on as 0.I-custom-<timestamp>. A manual run with "publish" unticked builds the
# packages and keeps them as workflow artifacts, without tagging or releasing anything.
concurrency: release
on:
  push:
    tags:
      - '0.I-custom-*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag and publish a release (untick for a test build kept as workflow artifacts)'
        type: boolean
        default: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      timestamp: ${{ steps.vars.outputs.time }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      publish: ${{ steps.vars.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set release variables
        id: vars
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          time=$(/bin/date -u "+%Y-%m-%d-%H%M")
          echo "time=$time" >> $GITHUB_OUTPUT
          if [ "$REF_TYPE" = tag ]; then
            echo "tag_name=$REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "tag_name=0.I-custom-$time" >> $GITHUB_OUTPUT
          fi
          if [ "$REF_TYPE" = tag ] || [ "$PUBLISH_INPUT" != false ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi
      - name: Check the branch has not moved on
        # GitHub refuses to let this workflow's token create a tag at an older
        # commit whose workflow files differ from the branch's (HTTP 403,
        # "Resource not accessible by integration"), so fail early and say why.
        if: steps.vars.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          head=$(git ls-remote origin "refs/heads/$REF_NAME" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$REF_NAME moved on to $head after this release started at $GITHUB_SHA. Start the release again from the branch head, or push a 0.I-custom-* tag at $GITHUB_SHA."
            exit 1
          fi
      - name: Write release notes
        env:
          tag: ${{ steps.vars.outputs.tag_name }}
        run: |
          prev=$(git tag --list '0.I-custom-*' --sort=-creatordate | grep -vxF "$tag" | head -n 1 || true)
          {
            echo "Unofficial build of this fork of Cataclysm: Dark Days Ahead, based on the 0.I stable release."
            echo "It is not made or supported by CleverRaven. What differs from 0.I: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGES.md"
            echo
            echo "Builds with sounds include the CC-Sounds soundpack (https://github.com/Fris0uman/CDDA-Soundpacks)."
            echo "Music by CO.AG (https://www.youtube.com/channel/UCcavSftXHgxLBWwLDm_bNvA), used with their permission."
            echo
            echo "Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            if [ -n "$prev" ]; then
              echo "Changes since $prev: https://github.com/${{ github.repository }}/compare/$prev...$tag"
            fi
          } > notes.txt
      - name: Create release
        if: steps.vars.outputs.publish == 'true'
        env:
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Cataclysm-DDA $TAG" --notes-file notes.txt

  builds:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Tiles x64 MSVC
            artifact: windows-with-graphics-x64
            arch: x64
            os: windows-2022
            ext: zip
            sound: 0
          - name: Windows Tiles Sounds x64 MSVC
            artifact: windows-with-graphics-and-sounds-x64
            arch: x64
            os: windows-2022
            ext: zip
            sound: 1
          - name: Linux Tiles Sounds x64
            artifact: linux-with-graphics-and-sounds-x64
            os: ubuntu-22.04
            ext: tar.gz
            tiles: 1
            sound: 1
            libbacktrace: 1
          - name: macOS Curses Universal (x64 and arm64)
            artifact: osx-terminal-only-universal
            os: macos-15
            ext: dmg
            tiles: 0
            sound: 0
          - name: macOS Tiles Sounds Universal (x64 and arm64)
            artifact: osx-with-graphics-and-sounds-universal
            os: macos-15
            ext: dmg
            tiles: 1
            sound: 1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ZSTD_CLEVEL: 17
      TAG: ${{ needs.release.outputs.tag_name }}
      PACKAGE: cdda-${{ needs.release.outputs.tag_name }}-${{ matrix.artifact }}.${{ matrix.ext }}
    steps:
      - name: Maximize build space (mac)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf "$ANDROID_HOME"
      - uses: actions/checkout@v4
        with:
          # Check out the release tag itself, so the build's version string names it.
          # A test build has no tag and builds the commit the workflow ran on.
          ref: ${{ needs.release.outputs.publish == 'true' && needs.release.outputs.tag_name || github.sha }}
      - name: Get soundpack
        if: matrix.sound == 1
        shell: bash
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks "$GITHUB_WORKSPACE/CDDA-Soundpacks"
          mv "$GITHUB_WORKSPACE/CDDA-Soundpacks/sound/CC-Sounds" "$GITHUB_WORKSPACE/data/sound"
      - name: Install dependencies (windows msvc) (0/4)
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@latest
        with:
          # 4.0.0 has issues compiling old packages in vcpkg
          cmakeVersion: 3.31.6
      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Install runtime dependencies (mac)
        if: runner.os == 'macOS'
        uses: BrettDong/setup-sdl2-frameworks@v2
        with:
          sdl2: 2.30.11
          sdl2-ttf: 2.24.0
          sdl2-image: 2.8.4
          sdl2-mixer: 2.8.0
      - name: Install build dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
      - name: Install MacPorts (mac)
        # Only the tiles build needs a universal FreeType; curses uses the system ncurses.
        if: runner.os == 'macOS' && matrix.tiles == 1
        uses: melusina-org/setup-macports@v1
      - name: Install MacPorts packages (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        run: |
          sudo port install freetype +universal pkgconfig +universal
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libsdl2-dev
          git clone https://github.com/libsdl-org/SDL.git --branch release-2.0.20 --depth 1
          cd SDL
          mkdir build
          cd build
          ../configure
          make -j$((`nproc`+0))
          sudo make install
          cp ../LICENSE.txt ${{ github.workspace }}/LICENSE-SDL.txt
          sudo apt-get install libncursesw5-dev libsdl2-ttf-dev libsdl2-image-dev \
            libsdl2-mixer-dev libpulse-dev ccache gettext parallel
      - name: Create VERSION.TXT
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: ${{ matrix.artifact }}
          release: $TAG
          build number: ${{ needs.release.outputs.timestamp }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL
      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all
      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install
      - name: Build CDDA (linux)
        if: runner.os == 'Linux'
        run: |
          make -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} PCH=0 bindist
          mv cataclysmdda-0.I.tar.gz "$PACKAGE"
      - name: Build CDDA (windows msvc)
        if: runner.os == 'Windows'
        env:
          # Enable pretty backtraces
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=${{ matrix.arch }} "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          mv cataclysmdda-0.I.zip "$env:PACKAGE"
      - name: Build CDDA (mac)
        if: runner.os == 'macOS'
        run: |
          make -j$(sysctl -n hw.ncpu) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 FRAMEWORK=1 UNIVERSAL_BINARY=1 dmgdist
          mv Cataclysm.dmg "$PACKAGE"
      - name: Upload package
        if: needs.release.outputs.publish == 'true'
        shell: bash
        run: |
          gh release upload "$TAG" "$PACKAGE"
      - name: Keep test build as workflow artifact
        if: needs.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}
          retention-days: 7
