name: "Release"
# Builds Windows and Linux packages of this fork and publishes them as a GitHub release.
# Push a tag named 0.I-custom-* to release the tagged commit. Running the workflow by hand
# also works once this file is on the repository's default branch; it tags the commit
# it runs on as 0.I-custom-<timestamp>.
concurrency: release
on:
  push:
    tags:
      - '0.I-custom-*'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      timestamp: ${{ steps.vars.outputs.time }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set release variables
        id: vars
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          time=$(/bin/date -u "+%Y-%m-%d-%H%M")
          echo "time=$time" >> $GITHUB_OUTPUT
          if [ "$REF_TYPE" = tag ]; then
            echo "tag_name=$REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "tag_name=0.I-custom-$time" >> $GITHUB_OUTPUT
          fi
      - name: Write release notes
        env:
          tag: ${{ steps.vars.outputs.tag_name }}
        run: |
          prev=$(git tag --list '0.I-custom-*' --sort=-creatordate | grep -vxF "$tag" | head -n 1 || true)
          {
            echo "Unofficial build of this fork of Cataclysm: Dark Days Ahead, based on the 0.I stable release."
            echo "It is not made or supported by CleverRaven; see the README for what differs from 0.I."
            echo
            echo "Builds with sounds include the CC-Sounds soundpack (https://github.com/Fris0uman/CDDA-Soundpacks)."
            echo "Music by CO.AG (https://www.youtube.com/channel/UCcavSftXHgxLBWwLDm_bNvA), used with their permission."
            echo
            echo "Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            if [ -n "$prev" ]; then
              echo "Changes since $prev: https://github.com/${{ github.repository }}/compare/$prev...$tag"
            fi
          } > notes.txt
      - name: Create release
        env:
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Cataclysm-DDA $TAG" --notes-file notes.txt

  builds:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Tiles x64 MSVC
            artifact: windows-with-graphics-x64
            arch: x64
            os: windows-2022
            ext: zip
            sound: 0
          - name: Windows Tiles Sounds x64 MSVC
            artifact: windows-with-graphics-and-sounds-x64
            arch: x64
            os: windows-2022
            ext: zip
            sound: 1
          - name: Linux Tiles Sounds x64
            artifact: linux-with-graphics-and-sounds-x64
            os: ubuntu-22.04
            ext: tar.gz
            tiles: 1
            sound: 1
            libbacktrace: 1
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      ZSTD_CLEVEL: 17
      TAG: ${{ needs.release.outputs.tag_name }}
      PACKAGE: cdda-${{ needs.release.outputs.tag_name }}-${{ matrix.artifact }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the release tag itself, so the build's version string names it.
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Get soundpack
        if: matrix.sound == 1
        shell: bash
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks "$GITHUB_WORKSPACE/CDDA-Soundpacks"
          mv "$GITHUB_WORKSPACE/CDDA-Soundpacks/sound/CC-Sounds" "$GITHUB_WORKSPACE/data/sound"
      - name: Install dependencies (windows msvc) (0/4)
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@latest
        with:
          # 4.0.0 has issues compiling old packages in vcpkg
          cmakeVersion: 3.31.6
      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ runner.workspace }}/b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root '${{ runner.workspace }}\b\vcpkg'
      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libsdl2-dev
          git clone https://github.com/libsdl-org/SDL.git --branch release-2.0.20 --depth 1
          cd SDL
          mkdir build
          cd build
          ../configure
          make -j$((`nproc`+0))
          sudo make install
          cp ../LICENSE.txt ${{ github.workspace }}/LICENSE-SDL.txt
          sudo apt-get install libncursesw5-dev libsdl2-ttf-dev libsdl2-image-dev \
            libsdl2-mixer-dev libpulse-dev ccache gettext parallel
      - name: Create VERSION.TXT
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: ${{ matrix.artifact }}
          release: $TAG
          build number: ${{ needs.release.outputs.timestamp }}
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL
      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all
      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install
      - name: Build CDDA (linux)
        if: runner.os == 'Linux'
        run: |
          make -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.sound }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} PCH=0 bindist
          mv cataclysmdda-0.I.tar.gz "$PACKAGE"
      - name: Build CDDA (windows msvc)
        if: runner.os == 'Windows'
        env:
          # Enable pretty backtraces
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=${{ matrix.arch }} "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          mv cataclysmdda-0.I.zip "$env:PACKAGE"
      - name: Upload package
        shell: bash
        run: |
          gh release upload "$TAG" "$PACKAGE"
